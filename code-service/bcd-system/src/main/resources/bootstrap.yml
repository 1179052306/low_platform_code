spring:
  application:
    name: bcd-system
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8001
        username: nacos
        password: nacos
        namespace: code
      config:
        server-addr: localhost:8001
        username: nacos
        password: nacos
        namespace: code
        file-extension: yml
        shared-configs:
          - data-id: datasource.yml
            refresh: true
          - data-id: redis.yml
            refresh: true
          - data-id: minio.yml
            refresh: true
          - data-id: rocketmq.yml
            refresh: true
          - data-id: tenant.yml
            refresh: true
          - data-id: management.yml
            refresh: true