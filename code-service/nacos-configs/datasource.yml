spring:
  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 60000
      idle-timeout: 600000
      max-lifetime: 3000000
      auto-commit: false
    names:
      - item:
        poolname: lowcode
        type: com.zaxxer.hikari.HikariDataSource
        jdbc-url: jdbc:postgresql://localhost:5432/postgres?currentSchema=public&characterEncoding=UTF-8
        username: postgres
        password: 123456
        driver-class-name: org.postgresql.Driver
        maximum-pool-size: 50
        minimum-idle: 10