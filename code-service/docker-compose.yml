      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-stock:
    build:
      context: ./bcd-wms-stock
      dockerfile: Dockerfile
    container_name: bcd-wms-stock
    ports:
      - "8012:8012"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-system:
    build:
      context: ./bcd-wms-system
      dockerfile: Dockerfile
    container_name: bcd-wms-system
    ports:
      - "8005:8005"
    depends_on:
      - nacos
