      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-out:
    build:
      context: ./bcd-wms-out
      dockerfile: Dockerfile
    container_name: bcd-wms-out
    ports:
      - "8007:8007"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-report:
    build:
      context: ./bcd-wms-report
      dockerfile: Dockerfile
    container_name: bcd-wms-report
    ports:
      - "8021:8021"
