version: '3.8'

# 公共环境变量（修改这里即可切换环境）
x-nacos-env: &nacos-env
  NACOS_SERVER_ADDR: "nacos:8848"
  NACOS_USERNAME: "nacos"
  NACOS_PASSWORD: "nacos"
  NACOS_DISCOVERY_NAMESPACE: "public"
  NACOS_CONFIG_NAMESPACE: "public"

x-fat-jar-java: &fat-jar-java
  JAVA_OPTS: "-server -Xms1G -Xmx1G -XX:+UseG1GC -Dfile.encoding=utf-8"

x-thin-jar-java: &thin-jar-java
  JAVA_OPTS: "-server -Xms1G -Xmx1G -XX:+UseG1GC -Dfile.encoding=utf-8 -Dloader.path=/app/lib"

services:
  # ==================== Nacos Server ====================
  nacos:
    image: nacos/nacos-server:2.1.0
    container_name: nacos
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - wms-net

  # ==================== Gateway (fat jar) ====================
  bcd-wms-gateway:
    build:
      context: ./bcd-wms-gateway
      dockerfile: Dockerfile
    container_name: bcd-wms-gateway
    ports:
      - "8004:8004"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *fat-jar-java]

  # ==================== Auth (fat jar) ====================
  bcd-wms-auth:
    build:
      context: ./bcd-wms-auth
      dockerfile: Dockerfile
    container_name: bcd-wms-auth
    ports:
      - "8003:8003"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *fat-jar-java]

  # ==================== Thin jar services ====================
  bcd-wms-base:
    build:
      context: ./bcd-wms-base
      dockerfile: Dockerfile
    container_name: bcd-wms-base
    ports:
      - "8015:8015"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-combox:
    build:
      context: ./bcd-wms-combox
      dockerfile: Dockerfile
    container_name: bcd-wms-combox
    ports:
      - "8010:8010"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-ifs:
    build:
      context: ./bcd-wms-ifs
      dockerfile: Dockerfile
    container_name: bcd-wms-ifs
    ports:
      - "8058:8058"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-in:
    build:
      context: ./bcd-wms-in
      dockerfile: Dockerfile
    container_name: bcd-wms-in
    ports:
      - "8009:8009"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-orderflow:
    build:
      context: ./bcd-wms-orderflow
      dockerfile: Dockerfile
    container_name: bcd-wms-orderflow
    ports:
      - "7256:7256"
    depends_on:
      - nacos
    networks:
      - wms-net
