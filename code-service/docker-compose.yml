    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-api-in:
    build:
      context: ./bcd-wms-api-in
      dockerfile: Dockerfile
    container_name: bcd-wms-api-in
    ports:
      - "8013:8013"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-api-ops:
    build:
      context: ./bcd-wms-api-ops
      dockerfile: Dockerfile
    container_name: bcd-wms-api-ops
    ports:
      - "8123:8023"
    depends_on:
      - nacos
    networks:
      - wms-net
    environment:
      <<: [*nacos-env, *thin-jar-java]

  bcd-wms-api-out:
    build:
      context: ./bcd-wms-api-out
      dockerfile: Dockerfile
    container_name: bcd-wms-api-out
    ports:
