<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书版权页 OCR 识别</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background-color: #f5f5f5; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 1.5rem; }
        .tabs { display: flex; margin-bottom: 0; border-bottom: 2px solid #eee; }
        .tab { padding: 0.8rem 1.2rem; cursor: pointer; border: 1px solid transparent; border-bottom: none; margin-right: 2px; border-radius: 6px 6px 0 0; transition: all 0.2s; color: #666; }
        .tab:hover { background: #f9f9f9; }
        .tab.active { background: #fff; border-color: #ddd; border-bottom: 2px solid #fff; margin-bottom: -2px; font-weight: bold; color: #007bff; }
        .tab-content { display: none; padding: 1.5rem 0; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333; }
        input[type="text"], input[type="file"] { width: 100%; padding: 0.6rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        input[type="text"]:focus { border-color: #007bff; outline: none; }
        button { background-color: #007bff; color: white; padding: 0.8rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .result-box { margin-top: 2rem; padding: 1.5rem; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; min-height: 150px; }
        .result-box h3 { margin-top: 0; color: #495057; }
        .result-box pre { margin: 0; white-space: pre-wrap; word-wrap: break-word; font-family: 'Consolas', monospace; font-size: 0.9rem; color: #333; }
        .error { color: #dc3545; background: #fff5f5; padding: 10px; border-radius: 4px; }
        .success { color: #28a745; }
        .preview-img { max-width: 100%; max-height: 300px; margin-top: 1rem; border: 1px solid #ddd; border-radius: 4px; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .loading-spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .meta-info { font-size: 0.8rem; color: #888; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 图书版权页 OCR 识别</h1>
        
        <div class="tabs">
            <!-- 顺序已调整：URL 放在第一位 -->
            <div class="tab active" onclick="switchTab('url')">🌐 网络图片 URL</div>
            <div class="tab" onclick="switchTab('path')">📁 本地文件路径</div>
            <div class="tab" onclick="switchTab('upload')">📤 上传图片文件</div>
        </div>

        <!-- 模式 1: 网络 URL (现在默认显示) -->
        <div id="tab-url" class="tab-content active">
            <div class="form-group">
                <label for="image-url">图片 HTTP/HTTPS 链接:</label>
                <input type="text" id="image-url" placeholder="http://example.com/image.jpg" oninput="previewUrlImage()">
                <img id="url-preview" class="preview-img" alt="URL 预览">
            </div>
            <button onclick="submitUrl()" id="btn-url">从 URL 加载并识别</button>
        </div>

        <!-- 模式 2: 文件路径 (移到第二位) -->
        <div id="tab-path" class="tab-content">
            <div class="form-group">
                <label for="image-path">图片绝对路径:</label>
                <input type="text" id="image-path" placeholder="/root/images/book.jpg">
            </div>
            <button onclick="submitPath()" id="btn-path">提交路径</button>
        </div>

        <!-- 模式 3: 上传文件 (保持在最后) -->
        <div id="tab-upload" class="tab-content">
            <div class="form-group">
                <label for="image-file">选择本地图片:</label>
                <input type="file" id="image-file" accept="image/*" onchange="previewImage()">
                <img id="preview" class="preview-img" alt="预览">
            </div>
            <button onclick="submitUpload()" id="btn-upload">上传并识别</button>
        </div>

        <div class="result-box">
            <h3>识别结果:</h3>
            <pre id="result-output">等待提交...</pre>
            <div id="meta-output" class="meta-info"></div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            // 更新索引逻辑以匹配新的顺序: url(0), path(1), upload(2)
            let index = 0;
            if (tabName === 'url') index = 0;
            else if (tabName === 'path') index = 1;
            else if (tabName === 'upload') index = 2;

            document.querySelectorAll('.tab')[index].classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }
        
        function previewImage() {
            const file = document.getElementById('image-file').files[0];
            const preview = document.getElementById('preview');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else { preview.style.display = 'none'; }
        }

        function previewUrlImage() {
            const url = document.getElementById('image-url').value.trim();
            const preview = document.getElementById('url-preview');
            if (url && url.startsWith('http')) {
                preview.src = url;
                preview.style.display = 'block';
                preview.onerror = function() { preview.style.display = 'none'; };
            } else { preview.style.display = 'none'; }
        }

        function setLoading(btnId, isLoading, originalText) {
            const btn = document.getElementById(btnId);
            if (isLoading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="loading-spinner"></span>处理中...';
            } else {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }

        function showResult(data) {
            const output = document.getElementById('result-output');
            const meta = document.getElementById('meta-output');
            
            const totalTime = data.total_time || data.business_time || 0;
            const businessTime = data.business_time || 0;
            const overhead = totalTime - businessTime;

            meta.innerHTML = `
                <strong>⏱️ 全链路总耗时:</strong> <span style="color:#007bff; font-size:1.1em">${totalTime.toFixed(3)}s</span><br>
                <small style="color:#666">
                    (其中：AI 推理与清洗 ${businessTime.toFixed(3)}s | 下载/解码/传输 ${overhead.toFixed(3)}s)
                </small>
            `;

            if (data.code === 200) {
                output.className = "success";
                output.innerText = "✅ 识别成功!\n\n" + JSON.stringify(data.data, null, 2);
            } else {
                output.className = "error";
                output.innerText = "❌ 失败:\n" + (data.detail || data.message || JSON.stringify(data));
            }
        }

        async function submitPath() {
            const path = document.getElementById('image-path').value.trim();
            if (!path) { alert('请输入图片路径'); return; }
            setLoading('btn-path', true, '提交路径');
            document.getElementById('result-output').innerText = "正在请求...";
            document.getElementById('meta-output').innerHTML = "";

            try {
                const response = await fetch(`/api/extract?image_path=${encodeURIComponent(path)}`);
                const data = await response.json();
                showResult(data);
            } catch (err) {
                document.getElementById('result-output').innerText = "网络请求失败: " + err.message;
                document.getElementById('result-output').className = "error";
            } finally {
                setLoading('btn-path', false, '提交路径');
            }
        }

        async function submitUpload() {
            const fileInput = document.getElementById('image-file');
            if (!fileInput.files.length) { alert('请选择图片'); return; }
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            setLoading('btn-upload', true, '上传并识别');
            document.getElementById('result-output').innerText = "正在上传...";
            document.getElementById('meta-output').innerHTML = "";

            reader.onload = async function(e) {
                const base64Data = e.target.result.split(',')[1]; 
                try {
                    const response = await fetch('/api/extract', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image_base64: base64Data })
                    });
                    const data = await response.json();
                    showResult(data);
                } catch (err) {
                    document.getElementById('result-output').innerText = "请求失败: " + err.message;
                    document.getElementById('result-output').className = "error";
                } finally {
                    setLoading('btn-upload', false, '上传并识别');
                }
            };
            reader.readAsDataURL(file);
        }

        async function submitUrl() {
            const url = document.getElementById('image-url').value.trim();
            if (!url) { alert('请输入图片 URL'); return; }
            if (!url.startsWith('http')) { alert('URL 必须以 http:// 开头'); return; }
            
            setLoading('btn-url', true, '从 URL 加载');
            document.getElementById('result-output').innerText = "正在下载图片...";
            document.getElementById('meta-output').innerHTML = "";

            try {
                const imgResponse = await fetch(url);
                if (!imgResponse.ok) throw new Error(`HTTP ${imgResponse.status}: 无法下载图片`);
                const blob = await imgResponse.blob();
                const reader = new FileReader();
                
                reader.onload = async function(e) {
                    const base64Data = e.target.result.split(',')[1];
                    try {
                        const response = await fetch('/api/extract', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ image_base64: base64Data })
                        });
                        const data = await response.json();
                        showResult(data);
                    } catch (err) {
                        document.getElementById('result-output').innerText = "识别接口调用失败: " + err.message;
                        document.getElementById('result-output').className = "error";
                    } finally {
                        setLoading('btn-url', false, '从 URL 加载');
                    }
                };
                reader.readAsDataURL(blob);
            } catch (err) {
                document.getElementById('result-output').innerText = "下载失败: " + err.message;
                document.getElementById('result-output').className = "error";
                setLoading('btn-url', false, '从 URL 加载');
            }
        }
    </script>
</body>
</html>
