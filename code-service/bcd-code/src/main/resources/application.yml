server:
  port: 3015
seata:
  enabled: false
spring:
  cloud:
    seata:
      enabled: false
  datasource:
    hikari:
      maximum-pool-size: 1000
      minimum-idle: 200
  redis:
    database: 0
    lettuce:
      pool:
        max-active: 16
        max-idle: 16
        min-idle: 4
        max-wait: 5000ms
tenant:
  tenanturl: ''
  systemType: ''
  defaultTenant: ''
rocketmq:
  producer:
    group: wms-code-producer-group
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
    max-message-size: 4194304
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:-1}
lowcode:
  security:
    local-debug: ${LOWCODE_LOCAL_DEBUG:true}
    gw-sign-secret: ${GW_SIGN_SECRET:bcd-lowcode-local-dev-gw-sign-secret!}
logging:
  file:
    name: logs/bcd-code.log
  level:
    root: info
